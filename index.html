<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề thi IELTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Màn hình đầu tiên bắt buộc bấm để kích hoạt âm thanh */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            cursor: pointer;
        }

        #start-screen h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .btn-play {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: 0.2s;
        }

        .btn-play:hover {
            background-color: #ff3377;
            transform: scale(1.05);
        }

        /* Màn hình Loading (5 giây) */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .loader {
            border: 5px solid #222;
            border-top: 5px solid #fff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #loading-screen h1 {
            color: #fff;
            font-size: 1.8rem;
            letter-spacing: 3px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Màn hình hiển thị Đề thi (10 giây) */
        #exam-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #exam-screen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Phần màn hình hù dọa (Jumpscare) */
        #jumpscare-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 10px) rotate(-3deg); }
            40% { transform: translate(10px, -10px) rotate(3deg); }
            60% { transform: translate(-5px, -5px) rotate(-1deg); }
            80% { transform: translate(5px, 5px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình đầu tiên để kích hoạt âm thanh -->
    <div id="start-screen">
        <h1>Bạn đã nhận được Đề thi IELTS!</h1>
        <button class="btn-play">MỞ ĐỀ THI</button>
    </div>

    <!-- Giao diện Loading (5 giây) -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h1>Đang tải nội dung... Vui lòng đợi</h1>
    </div>

    <!-- Giao diện hiển thị Đề thi (10 giây) -->
    <div id="exam-screen">
        <img src="exam.jpg" alt="Đề thi IELTS">
    </div>

    <!-- Giao diện hù dọa kèm âm thanh -->
    <div id="jumpscare-screen">
        <img src="scare.jpg" alt="Scare">
        <audio id="scream-audio" src="scream.mp3"></audio>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const examScreen = document.getElementById('exam-screen');
        const jumpscareScreen = document.getElementById('jumpscare-screen');
        const screamAudio = document.getElementById('scream-audio');
        const btnPlay = document.querySelector('.btn-play');

        btnPlay.addEventListener('click', () => {
            // Tải ngầm âm thanh để tránh bị chặn
            screamAudio.load();

            // Ẩn nút bấm, hiện màn hình Đang tải
            startScreen.style.display = 'none';
            loadingScreen.style.display = 'flex';

            // Sau 5 giây tải nội dung -> Hiện ảnh Đề thi IELTS
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                examScreen.style.display = 'flex';

                // Sau 10 giây hiện ảnh Đề thi -> Hù dọa luôn!
                setTimeout(() => {
                    examScreen.style.display = 'none';
                    jumpscareScreen.style.display = 'flex';
                    
                    // Phát âm thanh thét
                    screamAudio.play().catch(error => {
                        console.log("Lỗi phát âm thanh:", error);
                    });
                }, 10000); // 10 giây hiện đề thi
            }, 5000); // 5 giây loading
        });
    </script>
</body>
</html>
